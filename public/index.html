<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hinglify</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: rgba(30, 41, 59, 0.7);
  backdrop-filter: blur(15px);
  padding: 25px;
  border-radius: 15px;
  width: 350px;
  box-shadow: 0 0 30px rgba(56,189,248,0.2);
  text-align: center;
}

h1 {
  color: #38bdf8;
  margin-bottom: 5px;
}

p {
  font-size: 14px;
  opacity: 0.7;
}

select, input, button {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  border: none;
  outline: none;
}

input, select {
  background: #0f172a;
  color: white;
}

button {
  background: linear-gradient(90deg, #38bdf8, #6366f1);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

/* 🔥 Loader */
.loader {
  display: none;
  margin-top: 10px;
}
</style>

</head>

<body>

<div class="container">
  <h1>🔥 Hinglify</h1>
  <p>Convert English subtitles to Hinglish</p>

  <select id="apiType">
    <option value="chatgpt">ChatGPT</option>
    <option value="gemini">Gemini</option>
  </select>

  <input type="text" id="apiKey" placeholder="Enter API Key">

  <input type="file" id="fileInput" accept=".srt">

  <button onclick="convert()">Convert</button>

  <div class="loader" id="loader">⏳ Converting...</div>
</div>

<script src="script.js"></script>

</body>
</html>
