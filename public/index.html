<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hinglify</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: rgba(30, 41, 59, 0.7);
  backdrop-filter: blur(15px);
  padding: 25px;
  border-radius: 15px;
  width: 350px;
  text-align: center;
}

select, input, button {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 8px;
  border: none;
}

input, select {
  background: #0f172a;
  color: white;
}

button {
  background: linear-gradient(90deg, #38bdf8, #6366f1);
  color: white;
  font-weight: bold;
}

.loader { display: none; }
</style>
</head>

<body>

<div class="container">
  <h1>🔥 Hinglify</h1>
  <p>Convert English subtitles to Hinglish</p>

  <input type="text" id="apiKey" placeholder="Paste Gemini API Key">

  <input type="file" id="fileInput" accept=".srt">

  <button onclick="convert()">Convert</button>

  <div id="loader" class="loader">⏳ Converting...</div>
</div>

<script src="script.js"></script>
</body>
</html>
